plugins {
    id 'com.android.application'
}

def releaseKeystore = providers.environmentVariable('PF2E_ANDROID_KEYSTORE').orNull

android {
    namespace 'io.github.thewhytewolf.pf2esubsystems'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.thewhytewolf.pf2esubsystems'
        minSdk 24
        targetSdk 36
        versionCode providers.gradleProperty('appVersionCode').orElse('1').get().toInteger()
        versionName providers.gradleProperty('appVersionName').orElse('0.1.0').get()
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('PF2E_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('PF2E_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('PF2E_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/pf2eAssets')
}

dependencies {
    // Kotlin 1.8 merged the JDK7/JDK8 classes into stdlib; align older transitives.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation 'com.android.billingclient:billing:9.1.0'
}

// Package fresh, self-contained assets even when built directly in Android Studio.
def buildWebAssets = tasks.register('buildWebAssets', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'python3', 'tools/build.py', '--android'
    inputs.dir '../../src'
    inputs.dir '../../data'
    inputs.file '../../tools/build.py'
    inputs.file '../../LICENSE'
    inputs.file '../../notice.md'
    inputs.file '../NOTICE'
    outputs.dir layout.buildDirectory.dir('generated/pf2eAssets')
}
tasks.named('preBuild').configure { dependsOn buildWebAssets }
