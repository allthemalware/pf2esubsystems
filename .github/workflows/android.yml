name: Build Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test web app and Android integration
        run: |
          npm ci
          npm run check
      - name: Build and lint Android app
        run: |
          python3 tools/test_billing.py
          python3 tools/gradle.py --no-daemon lintDebug assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: pf2e-subsystems-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: pf2e-subsystems-unsigned-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
